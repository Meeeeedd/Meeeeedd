name: generate-animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: snake-animation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      SNAKE_COLOR: "%2334d399"
      GRID_DOTS: "%230b1220,%231a2b50,%232e4d7a,%233f6fb0,%2334d399"
    steps:
      - name: Draw the snake from latest contributions
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=${{ env.SNAKE_COLOR }}&color_dots=${{ env.GRID_DOTS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage snake as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snake-svg
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy snake to output branch
    runs-on: ubuntu-latest
    needs: generate
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Fetch snake artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snake-svg
          path: dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}